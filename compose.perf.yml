services:
  config-server:
    environment:
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}

  eureka-server:
    environment:
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}

  api-gateway:
    environment:
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}

  auth-service:
    environment:
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}

  catalog-service:
    environment:
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}
      OUTBOX_DELAY_MS: ${OUTBOX_DELAY_MS:-100}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-200}

  cart-service:
    environment:
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}

  notification-service:
    environment:
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}
      APP_MAIL_ENABLED: "false"

  order-service:
    environment:
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}
      OUTBOX_DELAY_MS: ${OUTBOX_DELAY_MS:-100}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-200}

  payment-service:
    environment:
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}
      OUTBOX_DELAY_MS: ${OUTBOX_DELAY_MS:-100}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-200}
